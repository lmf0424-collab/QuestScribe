name: Build QuestScribe IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project QuestScribe.xcodeproj \
            -scheme QuestScribe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/QuestScribe.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qry QuestScribe.ipa Payload
          cd ..
          ls -lh ipa/QuestScribe.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestScribe-unsigned-ipa
          path: ipa/QuestScribe.ipa
          if-no-files-found: error
