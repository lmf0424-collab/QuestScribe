# XcodeGen spec — generates QuestScribe.xcodeproj
# Usage (on any Mac/CI runner): xcodegen generate --spec project.yml
name: QuestScribe
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  QuestScribe:
    type: application
    platform: iOS
    sources:
      - QuestScribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.questscribe.app
        PRODUCT_NAME: QuestScribe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuestScribe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "QuestScribe uses the camera to photograph handwritten D&D prep notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "QuestScribe lets you pick photos of handwritten notes from your library."
    scheme:
      testTargets: []
